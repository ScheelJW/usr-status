<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uniformed Safe Rides status</title>
<meta name="description" content="Is Uniformed Safe Rides working right now?">
<style>
  :root { --bg:#f5f7fb; --card:#fff; --text:#0f1b2d; --muted:#4a5a70; --line:#d9e0ea; --ok:#1f7a4d; --okbg:#e6f4ec; --bad:#a3361f; --badbg:#fbeae5; --info:#1d4f91; --infobg:#e7eefa; --brand:#0b2545; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1422; --card:#121e30; --text:#eef3fa; --muted:#a9b6c8; --line:#26354b; --ok:#6fd39f; --okbg:#12301f; --bad:#ff9b85; --badbg:#3a1a14; --info:#8db7f2; --infobg:#142a47; --brand:#eef3fa; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  header img { width:40px; height:40px; border-radius:10px; }
  header h1 { font-size:20px; margin:0; color:var(--brand); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:16px; }
  .state { display:flex; gap:14px; align-items:flex-start; }
  .dot { flex:none; width:14px; height:14px; border-radius:50%; margin-top:7px; background:var(--muted); }
  .ok { background:var(--okbg); border-color:transparent; } .ok .dot { background:var(--ok); }
  .bad { background:var(--badbg); border-color:transparent; } .bad .dot { background:var(--bad); }
  .notice { background:var(--infobg); border-color:transparent; }
  h2 { font-size:20px; margin:0 0 4px; } h3 { font-size:17px; margin:0 0 8px; }
  p { margin:0 0 6px; } .muted { color:var(--muted); font-size:15px; }
  .rows { display:grid; gap:2px; margin-top:8px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line); }
  a { color:var(--info); }
</style>
</head>
<body>
<main>
  <header><img src="logo.png" alt=""><h1>Uniformed Safe Rides status</h1></header>

  <section id="state" class="card state" aria-live="polite"><span class="dot"></span><div><h2>Checking…</h2><p class="muted">Loading the latest status.</p></div></section>
  <section id="notice" class="card notice" hidden><h3></h3><p></p><p class="muted"></p></section>

  <section class="card">
    <h3>What we check</h3>
    <div class="rows">
      <div class="row"><span>Ride requests and the app</span><strong id="api">…</strong></div>
      <div class="row"><span>Website and team console</span><strong id="web">…</strong></div>
    </div>
    <p class="muted" id="checked"></p>
  </section>

  <p class="muted">This page runs separately from the rest of Uniformed Safe Rides so it keeps working during an outage.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ago = iso => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} hr ago` : new Date(iso).toLocaleString(); };

async function load(path) { const r = await fetch(`${path}?t=${Date.now()}`, {cache: 'no-store'}); if (!r.ok) throw new Error(r.status); return r.json(); }

async function showStatus() {
  let s; try { s = await load('status.json'); } catch { s = null; }
  const box = $('state'), c = s && s.checks, fresh = c && Date.now() - Date.parse(c.checkedAt) < 45 * 60000;
  const down = fresh && (c.api === 'down' || c.website === 'down');
  box.className = 'card state ' + (!fresh ? '' : down ? 'bad' : 'ok');
  box.querySelector('h2').textContent = !fresh ? 'Status not confirmed' : c.api === 'down' ? 'Ride requests are having trouble' : c.website === 'down' ? 'The website is having trouble' : 'Everything is working';
  box.querySelector('p').textContent = !fresh ? 'Our automatic check has not reported recently. If the app works for you, rides are running.' : down ? `Since ${new Date(c.downSince || c.checkedAt).toLocaleString()}. If you need a ride, call your base's ride line.` : 'Ride requests, the app and the website are all answering.';
  $('api').textContent = c ? (c.api === 'up' ? 'Working' : 'Having trouble') : 'Unknown';
  $('web').textContent = c ? (c.website === 'up' ? 'Working' : 'Having trouble') : 'Unknown';
  $('checked').textContent = c ? `Last checked ${ago(c.checkedAt)}. Checks run about every 5 minutes.` : '';
  const n = s && s.notice, nb = $('notice');
  nb.hidden = !n;
  if (n) { nb.querySelector('h3').textContent = n.title; nb.querySelectorAll('p')[0].textContent = n.message || ''; nb.querySelectorAll('p')[1].textContent = `Posted ${ago(n.updatedAt)}`; }
}

showStatus();
setInterval(showStatus, 60000);
</script>
</body>
</html>
