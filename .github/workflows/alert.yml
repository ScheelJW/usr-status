name: Production uptime

# Fails (and GitHub emails the repository owner) when the live backend stops answering.
# Read-only: three GET requests, no sign-in, no data created.
# Moved here from the private app repository on 2026-11-17: this repository is public, so
# its Actions minutes are free, while the app repository's minutes are capped.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the API, its database, support, and the website
        run: |
          check() {
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1" || true)
              [ "$code" = "200" ] && { echo "ok   $1"; return 0; }
              sleep 20
            done
            echo "::error::$1 answered $code after 3 tries"
            return 1
          }
          failed=0
          check https://api.uniformedsaferides.org/api/v1/health || failed=1
          check https://api.uniformedsaferides.org/api/v1/support/health || failed=1
          check https://gousr.app/ || failed=1
          exit $failed
