name: Check USR

# Runs off Cloudflare on purpose. Updates the public status page when USR's state or the notice
# changes. Alerts to Jared come from the main repository's uptime workflow, so this one never fails
# just because USR is down.
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: [NOTICE.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/check.mjs
      - if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'usr-status'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.json ride-lines.json
          git commit -m 'Update service status' || exit 0
          git pull --rebase --autostash && git push
